name: Validate Canon contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  canon-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"
      - name: Install contract test dependencies
        run: python -m pip install "jsonschema==4.25.1" "PyYAML==6.0.3"
      - name: Run executable declaration regression
        run: python -m unittest discover -s tests/canon-skill -v
      - name: Check out pinned upstream skill creator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .validation/skill-creator
          persist-credentials: false
      - name: Run upstream quick validator
        run: python .validation/skill-creator/skills/.system/skill-creator/scripts/quick_validate.py skills/canon-skill
