name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve Node dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Persist generated lock on candidate branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/structured-localization-and-smoke-tests'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/package-lock.json"
          status="$(curl --silent --show-error --output existing.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}?ref=${HEAD_REF}")"
          if [ "$status" = "200" ]; then
            echo "package-lock.json already exists on ${HEAD_REF}; leaving it unchanged"
          elif [ "$status" = "404" ]; then
            encoded="$(base64 -w0 package-lock.json)"
            jq -n \
              --arg message 'chore: lock gallery dependencies' \
              --arg content "$encoded" \
              --arg branch "$HEAD_REF" \
              '{message:$message,content:$content,branch:$branch}' > payload.json
            curl --fail --silent --show-error \
              --request PUT \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data @payload.json \
              "$api" >/dev/null
            echo "Committed package-lock.json to ${HEAD_REF}"
          else
            cat existing.json >&2
            echo "Unable to inspect package-lock.json on ${HEAD_REF} (HTTP ${status})" >&2
            exit 1
          fi

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Agent Skills validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate repository invariants
        run: ./scripts/validate-skills.py

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          for skill in skills/*; do
            skills-ref validate "$skill"
          done

      - name: Exercise symbolic-link installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/link-skills.sh

          target_dir="${RUNNER_TEMP}/agent-skills-target"
          mkdir -p "${target_dir}"

          mapfile -t skills < <(find skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          test "${#skills[@]}" -gt 0

          ./scripts/link-skills.sh --check --target "${target_dir}"
          ./scripts/link-skills.sh --target "${target_dir}"
          ./scripts/link-skills.sh --target "${target_dir}"

          for skill in "${skills[@]}"; do
            test "$(readlink "${target_dir}/${skill}")" = "${GITHUB_WORKSPACE}/skills/${skill}"
          done

          collision_skill="${skills[0]}"
          unlink "${target_dir}/${collision_skill}"
          touch "${target_dir}/${collision_skill}"
          if ./scripts/link-skills.sh --target "${target_dir}"; then
            printf 'collision test unexpectedly succeeded\n' >&2
            exit 1
          fi

      - name: Build and verify gallery
        run: npm run check

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser
