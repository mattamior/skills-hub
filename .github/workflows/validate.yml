name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Agent Skills validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate repository invariants
        run: ./scripts/validate-skills.py

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          for skill in skills/*; do
            skills-ref validate "$skill"
          done

      - name: Exercise symbolic-link installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/link-skills.sh

          target_dir="${RUNNER_TEMP}/agent-skills-target"
          mkdir -p "${target_dir}"

          mapfile -t skills < <(find skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          test "${#skills[@]}" -gt 0

          ./scripts/link-skills.sh --check --target "${target_dir}"
          ./scripts/link-skills.sh --target "${target_dir}"
          ./scripts/link-skills.sh --target "${target_dir}"

          for skill in "${skills[@]}"; do
            test "$(readlink "${target_dir}/${skill}")" = "${GITHUB_WORKSPACE}/skills/${skill}"
          done

          collision_skill="${skills[0]}"
          unlink "${target_dir}/${collision_skill}"
          touch "${target_dir}/${collision_skill}"
          if ./scripts/link-skills.sh --target "${target_dir}"; then
            printf 'collision test unexpectedly succeeded\n' >&2
            exit 1
          fi

      - name: Build and verify gallery
        run: npm run check

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser
